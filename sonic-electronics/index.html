<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sonic Electronics — Explore high-fidelity wireless headphones, premium audio gear, and exclusive deals.">
  <title>Sonic Electronics — Home</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products-data.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/home.js" defer></script>
</head>
<body>
  <div class="app-viewport">
    
    <!-- Top Mobile Status Bar (Figma Reference) -->
    <header class="status-bar" aria-label="System status">
      <span class="status-time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"/>
          <path d="M12 6a6 6 0 00-6 6c0 1.48.54 2.84 1.43 3.9L12 18.7l4.57-2.8A5.96 5.96 0 0018 12a6 6 0 00-6-6z"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
          <rect x="2" y="7" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="4" y="9" width="12" height="6" rx="1"/>
          <path d="M22 11v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </header>

    <!-- Main Site Header with Search Bar and Cart -->
    <header class="site-header">
      <div class="search-box-wrapper">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input 
          type="search" 
          id="home-search-input"
          class="header-search-input" 
          placeholder="Search products, brands & more" 
          aria-label="Search products, brands and more"
        >
      </div>
      <a href="cart.html" class="cart-icon-btn" aria-label="Shopping Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <circle cx="9" cy="20" r="1.5"/>
          <circle cx="18" cy="20" r="1.5"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="cart-badge" data-cart-badge style="display: none;">0</span>
      </a>
    </header>

    <!-- Home Scrollable Content -->
    <main class="home-container">
      
      <!-- Coral Promotional Banner -->
      <section class="welcome-banner" aria-label="Welcome announcement">
        <h1>Welcome to Rithik</h1>
        <p>Explore New Big Deals</p>
      </section>

      <!-- Category Showcase Section -->
      <section class="category-showcase" aria-label="Product categories">
        
        <!-- Top category tiles container -->
        <div class="category-top-cards">
          <a href="products.html?category=Laptops" class="cat-top-card" data-category-target="Laptops" aria-label="View Laptops">
            <div class="cat-visual">
              <svg viewBox="0 0 48 36" width="36" height="28" fill="none">
                <rect x="6" y="4" width="36" height="22" rx="2" stroke="#17594F" stroke-width="2.5" fill="#E7EFEB"/>
                <path d="M2 28h44a2 2 0 0 1 2 2v1H0v-1a2 2 0 0 1 2-2z" fill="#17594F"/>
                <line x1="18" y1="28" x2="30" y2="28" stroke="#FFFFFF" stroke-width="2"/>
              </svg>
            </div>
            <span>Laptops</span>
          </a>

          <a href="products.html?category=Headphones" class="cat-top-card" data-category-target="Headphones" aria-label="View Headphones">
            <div class="cat-visual">
              <svg viewBox="0 0 40 40" width="32" height="32" fill="none" stroke="#17594F" stroke-width="2.5">
                <path d="M6 22v-4a14 14 0 0 1 28 0v4"/>
                <rect x="4" y="22" width="6" height="12" rx="3" fill="#E7EFEB"/>
                <rect x="30" y="22" width="6" height="12" rx="3" fill="#E7EFEB"/>
              </svg>
            </div>
            <span>Headphones</span>
          </a>

          <a href="products.html?category=LED+TV" class="cat-top-card" data-category-target="LED TV" aria-label="View LED TV">
            <div class="cat-visual">
              <svg viewBox="0 0 48 36" width="36" height="28" fill="none">
                <rect x="4" y="4" width="40" height="24" rx="2" stroke="#17594F" stroke-width="2.5" fill="#E7EFEB"/>
                <path d="M18 28l-3 4m15-4l3 4m-12 0h9" stroke="#17594F" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <span>LED TV</span>
          </a>
        </div>

        <!-- Minimalist bottom icon category list -->
        <div class="category-minimal-list">
          <a href="products.html?category=Phones" class="cat-min-item" data-category-target="Phones">
            <div class="cat-min-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                <rect x="5" y="2" width="14" height="20" rx="3"/>
                <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="cat-min-label">Phones</span>
          </a>

          <a href="products.html?category=Headphones" class="cat-min-item" data-category-target="Headphones">
            <div class="cat-min-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                <path d="M3 14v-3a9 9 0 0 1 18 0v3"/>
                <path d="M3 14a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3v-2a3 3 0 0 0-3-3H3v5zM15 14a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3v-2a3 3 0 0 0-3-3h-3v5z"/>
              </svg>
            </div>
            <span class="cat-min-label">Headphones</span>
          </a>

          <a href="products.html?category=LED+TV" class="cat-min-item" data-category-target="LED TV">
            <div class="cat-min-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                <rect x="2" y="4" width="20" height="14" rx="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="18" x2="12" y2="21"/>
              </svg>
            </div>
            <span class="cat-min-label">LED TV</span>
          </a>

          <a href="products.html?category=Bluetooth+Buds" class="cat-min-item" data-category-target="Bluetooth Buds">
            <div class="cat-min-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                <rect x="4" y="6" width="16" height="14" rx="4"/>
                <path d="M4 11h16"/>
                <circle cx="8.5" cy="8.5" r="1" fill="currentColor"/>
                <circle cx="15.5" cy="8.5" r="1" fill="currentColor"/>
              </svg>
            </div>
            <span class="cat-min-label">Bluetooth buds</span>
          </a>
        </div>

      </section>

      <!-- Featured Headphone Products Section -->
      <section class="featured-products-section" aria-label="Featured Headphones">
        <div id="featured-products-grid" class="product-grid">
          <!-- Populated dynamically by js/home.js -->
        </div>
      </section>

    </main>

    <!-- Mobile Bottom Navigation Bar (Figma Reference) -->
    <nav class="bottom-nav-bar" aria-label="Bottom Navigation">
      <a href="index.html" class="bottom-nav-item active" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>

      <a href="products.html" class="bottom-nav-item" data-nav="explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        <span>Explore</span>
      </a>

      <a href="products.html?filter=saved" class="bottom-nav-item" data-nav="saved">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Saved</span>
      </a>

      <a href="cart.html" class="bottom-nav-item" data-nav="cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <circle cx="9" cy="20" r="1.5"/>
          <circle cx="18" cy="20" r="1.5"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span>Cart</span>
        <span class="bottom-nav-badge" data-cart-badge style="display: none;">0</span>
      </a>
    </nav>

  </div>
</body>
</html>
